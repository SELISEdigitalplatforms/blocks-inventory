name: Reusable - Build and Push Image

on:
  workflow_call:
    inputs:
      SERVICE_NAME:
        required: true
        type: string
        description: "Name of the service"
      SERVICE_TYPE:
        required: true
        type: string
        description: "Type of service: webclient, webservice, winservice"
      ENVIRONMENT:
        required: true
        type: string
        description: "Target environment: dev, staging, prod"
      VERSION:
        required: false
        type: string
        default: ""
        description: "Optional version suffix (e.g., '1.0.0' will create container-v1.0.0)"
      DOCKERFILE_PATH:
        required: true
        type: string
        default: "./Dockerfile"
        description: "Path to Dockerfile"
      BUILD_CONTEXT:
        required: false
        type: string
        default: "."
        description: "Build context directory, relative to repo root"
      BUILD_ARGS:
        required: false
        type: string
        default: ""
        description: 'Additional build arguments (format: "KEY1=value1 KEY2=value2" or multiline)'
      TAG_STRATEGY:
        required: false
        type: string
        default: "both"
        description: 'Tagging strategy: "both" (semantic + commit), "semantic", or "commit"'

    secrets:
      AZURE_CREDENTIALS:
        required: false
      AZURE_CONTAINER_REGISTRY:
        required: false
      ACR_RESOURCE_GROUP:
        required: false
      SELISE_GITHUB_PAT:
        required: true
      BUILD_SECRET_ARGS:
        required: false
        description: 'Secret build arguments in KEY=value format (same as BUILD_ARGS input but for sensitive values)'
      DOCKERHUB_USERNAME:
        required: false
        description: "DockerHub username. If set, image is pushed to DockerHub instead of ACR"
      DOCKERHUB_TOKEN:
        required: false
        description: "DockerHub access token/password"
      DOCKERHUB_ORG:
        required: false
        description: "DockerHub namespace/org prefix (e.g. blocksos)"

    outputs:
      image_tag:
        description: "Built image tag (primary)"
        value: ${{ jobs.build-and-push.outputs.image_tag }}
      container_name:
        description: "Container name (without registry)"
        value: ${{ jobs.build-and-push.outputs.container_name }}
      commit_tag:
        description: "Commit SHA tag"
        value: ${{ jobs.build-and-push.outputs.commit_tag }}
      semantic_tag:
        description: "Semantic tag"
        value: ${{ jobs.build-and-push.outputs.semantic_tag }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    outputs:
      image_tag: ${{ steps.generate-tag.outputs.tag }}
      container_name: ${{ steps.generate-tag.outputs.container_name }}
      commit_tag: ${{ steps.generate-tag.outputs.commit_tag }}
      semantic_tag: ${{ steps.generate-tag.outputs.semantic_tag }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          submodules: "true"
          token: ${{ secrets.SELISE_GITHUB_PAT }}

      - name: Update submodules
        run: |
          git submodule update --init --recursive

      - name: Generate Image Tags
        id: generate-tag
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          AZURE_CONTAINER_REGISTRY: ${{ secrets.AZURE_CONTAINER_REGISTRY }}
        run: |
          # Decide target registry: DockerHub if its username secret was passed, else ACR
          if [ -n "$DOCKERHUB_USERNAME" ]; then
            REGISTRY_KIND="dockerhub"
          elif [ -n "$AZURE_CONTAINER_REGISTRY" ]; then
            REGISTRY_KIND="acr"
          else
            echo "Neither DOCKERHUB_USERNAME nor AZURE_CONTAINER_REGISTRY secrets were provided; cannot determine target registry" >&2
            exit 1
          fi
          echo "registry_kind=${REGISTRY_KIND}" >> $GITHUB_OUTPUT

          # Generate tags based on strategy
          FULL_SHA="${{ github.sha }}"
          SHORT_SHA=$(echo ${{ github.sha }} | cut -c1-7)
          TIMESTAMP=$(date +%Y%m%d-%H%M%S)

          # Determine service type suffix for container naming
          SERVICE_TYPE="${{ inputs.SERVICE_TYPE }}"
          case "$SERVICE_TYPE" in
            "webservice")
              TYPE_SUFFIX=""
              ;;
            "winservice")
              TYPE_SUFFIX="-win"
              ;;
            "webclient")
              TYPE_SUFFIX="-webclient"
              ;;
            *)
              # For any other service type, include full type name
              TYPE_SUFFIX="-${SERVICE_TYPE}"
              ;;
          esac

          # Build container name with optional version
          BASE_NAME="${{ inputs.ENVIRONMENT }}-${{ inputs.SERVICE_NAME }}${TYPE_SUFFIX}"
          VERSION="${{ inputs.VERSION }}"

          if [ -n "$VERSION" ]; then
            CONTAINER_NAME="${BASE_NAME}-v${VERSION}"
          else
            CONTAINER_NAME="${BASE_NAME}"
          fi

          # Semantic tag: {env}-{timestamp}-{sha}
          SEMANTIC_TAG="${{ inputs.ENVIRONMENT }}-${TIMESTAMP}-${SHORT_SHA}"

          # Commit tag: full SHA
          COMMIT_TAG="${FULL_SHA}"

          # Determine primary tag based on strategy
          TAG_STRATEGY="${{ inputs.TAG_STRATEGY }}"

          case "$TAG_STRATEGY" in
            "semantic")
              PRIMARY_TAG="$SEMANTIC_TAG"
              USE_SEMANTIC_TAG="false"
              ;;
            "commit")
              PRIMARY_TAG="$COMMIT_TAG"
              USE_SEMANTIC_TAG="false"
              ;;
            "both"|*)
              PRIMARY_TAG="$COMMIT_TAG"
              USE_SEMANTIC_TAG="true"
              ;;
          esac

          if [ "$REGISTRY_KIND" = "dockerhub" ]; then
            REGISTRY="${{ secrets.DOCKERHUB_ORG }}"
          else
            REGISTRY="${AZURE_CONTAINER_REGISTRY}.azurecr.io"
          fi
          FULL_PATH="${REGISTRY}/${CONTAINER_NAME}:${PRIMARY_TAG}"
          SEMANTIC_FULL_PATH="${REGISTRY}/${CONTAINER_NAME}:${SEMANTIC_TAG}"

          # Set outputs
          echo "tag=${PRIMARY_TAG}" >> $GITHUB_OUTPUT
          echo "semantic_tag=${SEMANTIC_TAG}" >> $GITHUB_OUTPUT
          echo "commit_tag=${COMMIT_TAG}" >> $GITHUB_OUTPUT
          echo "container_name=${CONTAINER_NAME}" >> $GITHUB_OUTPUT
          echo "registry=${REGISTRY}" >> $GITHUB_OUTPUT
          echo "full_path=${FULL_PATH}" >> $GITHUB_OUTPUT
          echo "semantic_full_path=${SEMANTIC_FULL_PATH}" >> $GITHUB_OUTPUT
          echo "use_semantic_tag=${USE_SEMANTIC_TAG}" >> $GITHUB_OUTPUT

          # Summary
          echo "### 🏗️ Image Build Info" >> $GITHUB_STEP_SUMMARY
          echo "- **Strategy:** \`${TAG_STRATEGY}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Container:** \`${CONTAINER_NAME}\`" >> $GITHUB_STEP_SUMMARY
          if [ -n "$VERSION" ]; then
            echo "- **Version:** \`${VERSION}\`" >> $GITHUB_STEP_SUMMARY
          fi
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Tags Created in This Pipeline:**" >> $GITHUB_STEP_SUMMARY
          echo "- **Strategy:** \`${TAG_STRATEGY}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Container:** \`${CONTAINER_NAME}\`" >> $GITHUB_STEP_SUMMARY
          if [ -n "$VERSION" ]; then
            echo "- **Version:** \`${VERSION}\`" >> $GITHUB_STEP_SUMMARY
          fi
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Tags Created in This Pipeline:**" >> $GITHUB_STEP_SUMMARY

      - name: Azure Login
        if: steps.generate-tag.outputs.registry_kind != 'dockerhub'
        uses: azure/login@v3
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Login to Docker Hub
        if: steps.generate-tag.outputs.registry_kind == 'dockerhub'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Prepare Build Arguments
        id: build-args
        env:
          BUILD_SECRET_ARGS: ${{ secrets.BUILD_SECRET_ARGS }}
          REGISTRY: ${{ steps.generate-tag.outputs.registry }}
        run: |
          FORMATTED_ARGS=""
          FORMATTED_SECRET_ARGS=""

          # {{REGISTRY}} is a placeholder callers can use in BUILD_ARGS/BUILD_SECRET_ARGS
          # to reference this job's own registry host (e.g. for a build-arg pointing at
          # another image in the same registry) without ever passing the registry secret
          # itself through job outputs or `with:` (both cross a boundary where GitHub
          # Actions silently drops/empties values that contain a secret substring).
          BUILD_ARGS_INPUT="${{ inputs.BUILD_ARGS }}"
          BUILD_ARGS_INPUT="${BUILD_ARGS_INPUT//"{{REGISTRY}}"/$REGISTRY}"
          BUILD_SECRET_ARGS="${BUILD_SECRET_ARGS//"{{REGISTRY}}"/$REGISTRY}"

          process_args() {
            local input="$1"
            local flag="$2"
            local -n out_var="$3"
            input=$(echo "$input" | tr '\n' ' ')
            for arg in $input; do
              if [[ $arg == *"="* ]]; then
                out_var="$out_var $flag $arg"
              fi
            done
          }

          process_args "$BUILD_ARGS_INPUT" "--build-arg" FORMATTED_ARGS
          process_args "$BUILD_SECRET_ARGS" "--secret-build-arg" FORMATTED_SECRET_ARGS

          echo "formatted_args=$FORMATTED_ARGS" >> $GITHUB_OUTPUT
          echo "formatted_secret_args=$FORMATTED_SECRET_ARGS" >> $GITHUB_OUTPUT
          [ -n "$FORMATTED_ARGS" ] && echo "Build arguments prepared" || echo "No additional build arguments"
          [ -n "$FORMATTED_SECRET_ARGS" ] && echo "Secret build arguments prepared" || echo "No secret build arguments"

      - name: Build and Push to ACR
        if: steps.generate-tag.outputs.registry_kind != 'dockerhub'
        run: |
          az acr build \
            --image ${{ steps.generate-tag.outputs.full_path }} \
            --registry ${{ secrets.AZURE_CONTAINER_REGISTRY }} \
            -g ${{ secrets.ACR_RESOURCE_GROUP }} \
            --file ${{ inputs.DOCKERFILE_PATH }} \
            ${{ steps.build-args.outputs.formatted_args }} \
            ${{ steps.build-args.outputs.formatted_secret_args }} \
            ${{ inputs.BUILD_CONTEXT }}

      - name: Build and Push to Docker Hub
        if: steps.generate-tag.outputs.registry_kind == 'dockerhub'
        run: |
          docker build \
            -t ${{ steps.generate-tag.outputs.full_path }} \
            --file ${{ inputs.DOCKERFILE_PATH }} \
            ${{ steps.build-args.outputs.formatted_args }} \
            ${{ steps.build-args.outputs.formatted_secret_args }} \
            ${{ inputs.BUILD_CONTEXT }}
          docker push ${{ steps.generate-tag.outputs.full_path }}

      - name: Add Semantic Tag (ACR)
        if: steps.generate-tag.outputs.registry_kind != 'dockerhub' && steps.generate-tag.outputs.use_semantic_tag == 'true'
        run: |
          # Import the image with an additional tag (this creates an alias, no extra storage)
          az acr import \
            --name ${{ secrets.AZURE_CONTAINER_REGISTRY }} \
            --source ${{ steps.generate-tag.outputs.full_path }} \
            --image ${{ steps.generate-tag.outputs.semantic_full_path }} \
            --resource-group ${{ secrets.ACR_RESOURCE_GROUP }}

          echo "✅ Added semantic tag: ${{ steps.generate-tag.outputs.semantic_tag }}" >> $GITHUB_STEP_SUMMARY

      - name: Add Semantic Tag (Docker Hub)
        if: steps.generate-tag.outputs.registry_kind == 'dockerhub' && steps.generate-tag.outputs.use_semantic_tag == 'true'
        run: |
          docker tag ${{ steps.generate-tag.outputs.full_path }} ${{ steps.generate-tag.outputs.semantic_full_path }}
          docker push ${{ steps.generate-tag.outputs.semantic_full_path }}

          echo "✅ Added semantic tag: ${{ steps.generate-tag.outputs.semantic_tag }}" >> $GITHUB_STEP_SUMMARY

      - name: Verify Image (ACR)
        if: steps.generate-tag.outputs.registry_kind != 'dockerhub'
        run: |
          # Verify primary tag exists
          az acr repository show \
            --name ${{ secrets.AZURE_CONTAINER_REGISTRY }} \
            --image ${{ steps.generate-tag.outputs.container_name }}:${{ steps.generate-tag.outputs.tag }}

          echo "✅ Image successfully pushed and verified" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          # Show tags created in this pipeline
          REGISTRY="${{ secrets.AZURE_CONTAINER_REGISTRY }}.azurecr.io"
          CONTAINER="${{ steps.generate-tag.outputs.container_name }}"

          # Primary tag (commit SHA)
          echo "1. **Commit SHA (Primary):** \`${REGISTRY}/${CONTAINER}:${{ steps.generate-tag.outputs.commit_tag }}\`" >> $GITHUB_STEP_SUMMARY

          # Semantic tag (if strategy is "both")
          if [ "${{ steps.generate-tag.outputs.use_semantic_tag }}" = "true" ]; then
            echo "2. **Semantic Tag:** \`${REGISTRY}/${CONTAINER}:${{ steps.generate-tag.outputs.semantic_tag }}\`" >> $GITHUB_STEP_SUMMARY
          fi

      - name: Verify Image (Docker Hub)
        if: steps.generate-tag.outputs.registry_kind == 'dockerhub'
        run: |
          docker manifest inspect ${{ steps.generate-tag.outputs.full_path }} > /dev/null

          echo "✅ Image successfully pushed and verified" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "1. **Commit SHA (Primary):** \`${{ steps.generate-tag.outputs.full_path }}\`" >> $GITHUB_STEP_SUMMARY

          if [ "${{ steps.generate-tag.outputs.use_semantic_tag }}" = "true" ]; then
            echo "2. **Semantic Tag:** \`${{ steps.generate-tag.outputs.semantic_full_path }}\`" >> $GITHUB_STEP_SUMMARY
          fi
