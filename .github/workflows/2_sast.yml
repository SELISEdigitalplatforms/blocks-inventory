name: Analyze Code Quality

on:
  workflow_call:
    inputs:
      dotnet-version:
        description: 'The dotnet version to use'
        required: false
        type: string
        default: '9.0.x'
    secrets:
      SONAR_TOKEN:
        required: true
      SONAR_GET:
        required: true

permissions:
  contents: read
  checks: write
  pull-requests: read

jobs:
  build:
    name: SonarQube Analysis
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Set Environment Variables
        uses: ./.github/actions/setvars
        with:
          varFilePath: ./.github/variables/vars.env

      - name: Setup JDK 17
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5.2.0
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: ${{ inputs.dotnet-version }}

      - name: Clear NuGet cache (avoid version conflicts)
        run: dotnet nuget locals all --clear

      - name: Cache Sonar packages
        uses: actions/cache@cdf6c1fa76f9f475f3d7449005a359c84ca0f306 # v5.0.3
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar

      - name: Install Sonar Scanner
        run: dotnet tool install --global dotnet-sonarscanner

      - name: Add .NET tools to PATH
        run: echo "$HOME/.dotnet/tools" >> $GITHUB_PATH

      - name: SonarQube Analysis
        working-directory: ./src
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          dotnet-sonarscanner begin \
            /k:"${{ env.SONAR_KEY }}" \
            /o:"${{ env.AUTHOR }}" \
            /d:sonar.login="${{ secrets.SONAR_TOKEN }}" \
            /d:sonar.host.url="${{ env.SONARQUBE_HOST }}" \
            /d:sonar.projectBaseDir="./" \
            /d:sonar.cs.cobertura.reportsPaths="**/coverage.cobertura.xml"

          dotnet restore "./${{ env.SOLUTION_NAME }}"

          dotnet build "./${{ env.SOLUTION_NAME }}" --no-incremental

          dotnet test "./${{ env.SOLUTION_NAME }}" \
            --no-build \
            --collect:"XPlat Code Coverage" \
            --results-directory ./TestResults

          dotnet-sonarscanner end \
            /d:sonar.login="${{ secrets.SONAR_TOKEN }}"

      - name: SonarQube Quality Gate check
        id: quality-gate
        uses: sonarsource/sonarqube-quality-gate-action@cb3ed20f9fec62b4c3b8ad9e77656c6adaade913
        timeout-minutes: 5
        with:
          scanMetadataReportFile: src/.sonarqube/out/.sonar/report-task.txt
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ env.SONARQUBE_HOST }}

      - name: Fetch SonarQube metrics
        if: always()
        shell: bash
        env:
          SONAR_GET: ${{ secrets.SONAR_GET }}
        run: |
          SONAR_BASE="${SONARQUBE_HOST%/}"
          REPORT_TASK="src/.sonarqube/out/.sonar/report-task.txt"

          if [ -f "$REPORT_TASK" ]; then
            CE_TASK_URL=$(awk -F= '/ceTaskUrl/ {print $2}' "$REPORT_TASK" | tr -d '\r')
            echo "Waiting for SonarQube task: $CE_TASK_URL"

            for i in {1..10}; do
              TASK_STATUS=$(curl -sS -u "${SONAR_GET}:" "$CE_TASK_URL" | jq -r '.task.status')
              echo "Task status: $TASK_STATUS"
              if [ "$TASK_STATUS" = "SUCCESS" ]; then
                sleep 5
                break
              fi
              sleep 10
            done
          fi

          if [ "${{ github.event_name }}" = "pull_request" ]; then
            QUERY_PARAM="pullRequest=${{ github.event.pull_request.number }}"
          else
            QUERY_PARAM="branch=${GITHUB_REF_NAME}"
          fi

          METRICS="duplicated_lines_density,duplicated_lines,duplicated_blocks,security_hotspots,security_hotspots_reviewed,security_review_rating,vulnerabilities"

          URL="${SONAR_BASE}/api/measures/component?component=${SONAR_KEY}&metricKeys=${METRICS}&${QUERY_PARAM}"

          curl -sS -u "${SONAR_GET}:" "$URL" > sonar-metrics.json

      - name: SAST Summary
        if: always()
        shell: bash
        run: |
          METRICS_FILE="sonar-metrics.json"

          get_metric() {
            if [ -f "$METRICS_FILE" ]; then
              jq -r --arg k "$1" '.component.measures[] | select(.metric==$k) | .value' "$METRICS_FILE" 2>/dev/null || echo "n/a"
            else
              echo "n/a"
            fi
          }

          {
            echo "### SAST (SonarQube) Summary"
            echo ""
            echo "| Metric | Value |"
            echo "| --- | --- |"
            echo "| **Quality Gate** | \`${{ steps.quality-gate.outcome }}\` |"
            echo "| **Vulnerabilities** | \`$(get_metric vulnerabilities)\` |"
            echo "| **Security Hotspots** | \`$(get_metric security_hotspots)\` |"
            echo "| **Duplication Density** | \`$(get_metric duplicated_lines_density) %\` |"
            echo "| **Duplicated Lines** | \`$(get_metric duplicated_lines)\` (Blocks: \`$(get_metric duplicated_blocks)\`) |"
            echo ""
            echo "Detailed report: ${SONARQUBE_HOST}/dashboard?id=${SONAR_KEY}"
          } >> "$GITHUB_STEP_SUMMARY"
