name: Check Enterprise Updates

on:
  schedule:
    - cron: '0 8 * * 1-5'
  workflow_dispatch:
    inputs:
      source_env:
        description: 'Source environment to compare with enterprise'
        required: true
        type: choice
        options:
          - prod
          - stg
        default: 'prod'

concurrency:
  group: check-enterprise-updates
  cancel-in-progress: true

jobs:
  check-enterprise-updates:
    runs-on: ubuntu-slim
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Check for updates and create PRs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -uo pipefail

          REPO="${{ github.repository }}"
          SOURCE_ENV="${{ inputs.source_env }}"
          [ -z "$SOURCE_ENV" ] && SOURCE_ENV="prod"
          DATE=$(date +'%Y-%m-%d')
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

          git config user.name "GitHub Actions Bot"
          git config user.email "github-actions-bot@selisegroup.com"

          # ── Summary Header ──
          echo "## Enterprise Update Check" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| | |" >> "$GITHUB_STEP_SUMMARY"
          echo "|---|---|" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Source Environment** | \`${SOURCE_ENV}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Date** | ${DATE} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Trigger** | \`${{ github.event_name }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"

          # ── Tracking ──
          TOTAL=0
          UP_TO_DATE=0
          UPDATES=0
          PRS_CREATED=0
          PRS_UPDATED=0
          SKIPPED=0
          ERRORS=0

          declare -A SVC_DATA

          # ── Phase 1: Discover and Compare ──
          while IFS= read -r efile; do
            efile="${efile#./}"
            TOTAL=$((TOTAL + 1))
            SVC=$(echo "$efile" | cut -d'/' -f1)
            TYPE=$(echo "$efile" | cut -d'/' -f2)

            SFILE="${SVC}/${TYPE}/${SOURCE_ENV}.txt"
            ASRC="${SOURCE_ENV}"

            if [ ! -f "$SFILE" ]; then
              if [ "$SOURCE_ENV" = "prod" ] && [ -f "${SVC}/${TYPE}/stg.txt" ]; then
                SFILE="${SVC}/${TYPE}/stg.txt"
                ASRC="stg (no prod)"
              else
                SKIPPED=$((SKIPPED + 1))
                continue
              fi
            fi

            SRC=$(grep -v '^[[:space:]]*$' "$SFILE" | tail -1 || true)
            ENT=$(grep -v '^[[:space:]]*$' "$efile" | tail -1 || true)

            if [ -z "$SRC" ]; then
              SKIPPED=$((SKIPPED + 1))
              continue
            fi

            if [ "$SRC" = "$ENT" ]; then
              UP_TO_DATE=$((UP_TO_DATE + 1))
            else
              UPDATES=$((UPDATES + 1))
              SVC_DATA[$SVC]+="${TYPE}|${SRC}|${ENT}|${ASRC}|${efile}"$'\n'
            fi
          done < <(find . -name "enterprise.txt" -type f | sort)

          # ── Phase 2: Create PRs per service ──
          if [ ${#SVC_DATA[@]} -gt 0 ]; then
            echo "### Updates" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "| Service | Type | Source | Enterprise Version | New Version | Status |" >> "$GITHUB_STEP_SUMMARY"
            echo "|---------|------|--------|--------------------|-------------|--------|" >> "$GITHUB_STEP_SUMMARY"

            for SVC in $(printf '%s\n' "${!SVC_DATA[@]}" | sort); do
              BRANCH="enterprise-update/${SVC}"
              STATUS="No changes"

              git checkout main
              git pull --rebase origin main
              git checkout -B "$BRANCH" main

              # Build PR body
              PR_BODY="## Enterprise Update: \`${SVC}\`"$'\n\n'
              PR_BODY+="| | |"$'\n'
              PR_BODY+="|---|---|"$'\n'
              PR_BODY+="| **Source** | \`${SOURCE_ENV}\` |"$'\n'
              PR_BODY+="| **Date** | ${DATE} |"$'\n'
              PR_BODY+="| **Workflow Run** | [View](${RUN_URL}) |"$'\n\n'
              PR_BODY+="### Changes"$'\n\n'
              PR_BODY+="| Type | Current Enterprise | New Version |"$'\n'
              PR_BODY+="|------|--------------------|-------------|"$'\n'

              # Apply file changes
              while IFS='|' read -r TYPE SRC ENT ASRC EFILE; do
                [ -z "$TYPE" ] && continue
                echo "$SRC" >> "$EFILE"
                git add "$EFILE"
                PR_BODY+="| ${TYPE} | \`${ENT##*:}\` | \`${SRC##*:}\` |"$'\n'
              done <<< "${SVC_DATA[$SVC]}"

              if ! git diff --cached --quiet; then
                git commit -m "Update ${SVC} enterprise to latest ${SOURCE_ENV}"

                if git push origin "$BRANCH" --force; then
                  # Check for existing open PR on this branch
                  EXISTING=$(gh pr list --repo "$REPO" --state open --head "$BRANCH" --json number,url --jq '.[0]' 2>/dev/null || echo "")

                  if [ -n "$EXISTING" ] && [ "$EXISTING" != "null" ]; then
                    PR_NUM=$(echo "$EXISTING" | jq -r '.number')
                    PR_URL=$(echo "$EXISTING" | jq -r '.url')
                    gh pr edit "$PR_NUM" --repo "$REPO" --body "$PR_BODY" 2>/dev/null || true
                    PRS_UPDATED=$((PRS_UPDATED + 1))
                    STATUS="[PR #${PR_NUM}](${PR_URL}) updated"
                  else
                    PR_TITLE="Enterprise update: ${SVC} (from ${SOURCE_ENV})"
                    if PR_URL=$(gh pr create --repo "$REPO" --title "$PR_TITLE" --body "$PR_BODY" --head "$BRANCH" --base main 2>/dev/null); then
                      PR_NUM=$(basename "$PR_URL")
                      PRS_CREATED=$((PRS_CREATED + 1))
                      STATUS="[PR #${PR_NUM}](${PR_URL}) created"
                    else
                      ERRORS=$((ERRORS + 1))
                      STATUS="Failed to create PR"
                    fi
                  fi
                else
                  ERRORS=$((ERRORS + 1))
                  STATUS="Push failed"
                fi
              fi

              # Add rows to summary table
              FIRST=true
              while IFS='|' read -r TYPE SRC ENT ASRC EFILE; do
                [ -z "$TYPE" ] && continue
                if $FIRST; then
                  echo "| **${SVC}** | ${TYPE} | ${ASRC} | \`${ENT##*:}\` | \`${SRC##*:}\` | ${STATUS} |" >> "$GITHUB_STEP_SUMMARY"
                  FIRST=false
                else
                  echo "| | ${TYPE} | ${ASRC} | \`${ENT##*:}\` | \`${SRC##*:}\` | |" >> "$GITHUB_STEP_SUMMARY"
                fi
              done <<< "${SVC_DATA[$SVC]}"

              # Reset to main for next iteration
              git checkout main 2>/dev/null || true
            done
          else
            echo "### All Enterprise Environments Up to Date" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "No updates needed — all enterprise versions match the latest \`${SOURCE_ENV}\` versions." >> "$GITHUB_STEP_SUMMARY"
          fi

          # ── Final Summary ──
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "---" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "### Summary" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Metric | Count |" >> "$GITHUB_STEP_SUMMARY"
          echo "|--------|-------|" >> "$GITHUB_STEP_SUMMARY"
          echo "| Components Checked | ${TOTAL} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Already Up to Date | ${UP_TO_DATE} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Updates Found | ${UPDATES} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| PRs Created | ${PRS_CREATED} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| PRs Updated | ${PRS_UPDATED} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Skipped (no source) | ${SKIPPED} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Errors | ${ERRORS} |" >> "$GITHUB_STEP_SUMMARY"

          [ "$ERRORS" -gt 0 ] && exit 1
          exit 0
